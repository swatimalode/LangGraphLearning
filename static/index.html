<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#f5f5f5">

<title>Swati AI Assistant</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="app">

<header class="header">
    <h1>Swati AI Assistant</h1>
</header>


<main class="chat-container">

    <!-- Chat messages -->
    <div id="messages" class="messages">

        <div class="message assistant">
            <div class="bubble">
                Hello! Ask me anything!
            </div>
        </div>

    </div>


    <!-- Loading -->
    <div id="loading" class="loading hidden">
        Thinking...
    </div>


    <!-- Input area -->
    <div class="input-area">

        <!-- Selected file -->
        <div id="selectedFile" class="selected-file hidden">

            <span class="file-icon">
                📄
            </span>

            <span id="fileName"></span>

            <button
                type="button"
                class="remove-file"
                onclick="removeFile()"
            >
                ×
            </button>

        </div>


        <!-- Upload + text + send -->
        <div class="chat-input">

            <!-- Hidden file input -->
            <input
                type="file"
                id="fileInput"
                accept=".pdf,.txt,.doc,.docx"
                multiple
                hidden
            >


            <!-- Upload button -->
            <button
                type="button"
                class="upload-button"
                onclick="document.getElementById('fileInput').click()"
            >
                📎 Upload
            </button>


            <!-- Text -->
            <textarea
                id="messageInput"
                placeholder="Ask something..."
                rows="2"
                    aria-label="Message"
            ></textarea>


            <!-- Send -->
            <button
                type="button"
                class="send-button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


        <div id="uploadStatus" class="upload-status"></div>

    </div>

</main>

</div>

<!-- Markdown renderer -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Application JS -->

<script src="/app.js?v=20261009-multi-file"></script>

</body>
</html>
